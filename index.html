<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kantor PovQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span>Kantor PovQ</div>
      <div class="mode-toggle" role="group" aria-label="Mode tampilan kantor">
        <button type="button" data-mode="pixel" aria-pressed="true">Pixel</button>
        <button type="button" data-mode="2d" aria-pressed="false">2D</button>
      </div>
      <div class="topbar-info" id="topbar-info"></div>
    </header>
    <main class="layout">
      <section class="office" aria-label="Ruang kantor">
        <canvas id="office"></canvas>
      </section>
      <aside class="panel" id="panel"></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
