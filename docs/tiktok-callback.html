<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>PovQ Studio: menghubungkan TikTok</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16131f; color: #f1ecdf; font: 15px/1.6 ui-monospace, monospace; padding: 16px; }
  main { max-width: 520px; }
  a { color: #f2b33d; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Menghubungkan TikTok…</h1>
  <p>Halaman ini meneruskan login TikTok ke PovQ Studio yang berjalan di komputermu.</p>
  <p>Kalau tidak berpindah otomatis, buka: <a id="lanjut" href="#">lanjutkan ke PovQ Studio</a></p>
</main>
<script>
  // Alamat PovQ Studio di komputer ini (port bawaan 8787).
  var asal = sessionStorage.getItem("povq-app") || "http://localhost:8787";
  var tujuan = asal.replace(/\/$/, "") + "/api/oauth/tiktok/callback" + location.search;
  document.getElementById("lanjut").href = tujuan;
  location.replace(tujuan);
</script>
</body>
</html>
